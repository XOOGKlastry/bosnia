<!doctype html>
<html lang="pl">
<head>

  <meta name="description" content="Mobilna mapa lokalizacji nalotów w Bochni.">
  <title>Naloty · Bochnia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{color-scheme:light;--ink:#153b35;--muted:#61766f;--paper:#f7f8f3;--line:#dce5de;--lime:#d8ef78;--green:#17715d;--blue:#315f9b}
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0}body{overflow:hidden;background:#e5ece7;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,a{font:inherit}button{color:inherit;touch-action:manipulation}
    #map{position:fixed;inset:0;z-index:0}.topbar{position:fixed;z-index:500;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid #153b3520;border-radius:18px;background:#fffffff2;box-shadow:0 8px 28px #153b3520;backdrop-filter:blur(14px)}.brand{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:13px;background:var(--ink);color:var(--lime);font-size:23px}.topbar h1{margin:0;font-size:17px;line-height:1.1;letter-spacing:-.02em}.topbar p{margin:0 0 3px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.toolbar{position:fixed;z-index:450;top:78px;left:10px;right:10px;display:grid;grid-template-columns:.95fr 1.25fr .8fr;gap:7px}.toolbar button,.filters button{min-height:42px;border:1px solid #153b3520;border-radius:12px;background:#fffffff2;box-shadow:0 4px 14px #153b3519;font-size:12px;font-weight:800;cursor:pointer}.toolbar button{display:flex;justify-content:center;align-items:center;gap:6px;padding:0 8px}.filters{position:fixed;z-index:440;top:127px;left:10px;display:flex;gap:7px}.filters button{min-height:34px;padding:0 11px;font-size:11px}.filters button[aria-pressed="false"]{opacity:.48;text-decoration:line-through}.filters .dot{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;background:var(--green)}.filters button[data-layer="parki2"] .dot{background:var(--blue)}
    .hint,.details,.parcel-card,.list-sheet,.status{position:fixed;z-index:550;left:10px;right:10px}.hint,.details,.parcel-card{bottom:max(10px,env(safe-area-inset-bottom));border:1px solid #153b351e;border-radius:19px;background:#fffffff5;box-shadow:0 12px 35px #153b3530;backdrop-filter:blur(12px)}.hint{min-height:68px;display:flex;align-items:center;gap:11px;padding:12px;text-align:left;cursor:pointer}.hint .symbol{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:12px;background:#eff5d9;font-size:20px}.hint strong,.hint small{display:block}.hint strong{font-size:13px}.hint small{margin-top:3px;color:var(--muted);font-size:11px}.details,.parcel-card{max-height:55vh;overflow:auto;padding:15px}.close{position:absolute;top:9px;right:9px;width:36px;height:36px;border:0;border-radius:50%;background:#edf1ed;font-size:22px;cursor:pointer}.detail-head{display:flex;gap:10px;padding-right:40px}.badge{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:11px;background:var(--lime);font-weight:900}.detail-head p,.section-label{margin:0 0 3px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.detail-head h2,.parcel-card h2{margin:0;font-size:17px;line-height:1.2}.meta{display:grid;gap:6px;margin:12px 0}.meta div{padding:8px 10px;border-radius:10px;background:#f0f4ef}.meta dt{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.meta dd{margin:3px 0 0;font-size:12px;line-height:1.3;overflow-wrap:anywhere}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.links a{min-height:43px;display:flex;justify-content:center;align-items:center;gap:6px;border-radius:11px;background:var(--ink);color:#fff;text-decoration:none;font-size:12px;font-weight:800}.links a.secondary{border:1px solid var(--ink);background:#fff;color:var(--ink)}.parcel-card{border-top:4px solid #e6b938}.parcel-card h2{padding:1px 40px 8px 0;font-size:20px}.parcel-meta{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.status{top:174px;left:10px;right:auto;max-width:calc(100% - 20px);padding:8px 11px;border-radius:10px;background:var(--ink);color:#fff;font-size:11px;box-shadow:0 4px 12px #153b3522}
    .list-sheet{z-index:700;top:auto;bottom:0;left:0;right:0;max-height:82vh;display:flex;flex-direction:column;border-radius:22px 22px 0 0;background:var(--paper);box-shadow:0 -12px 36px #153b352b;padding-bottom:env(safe-area-inset-bottom)}.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}.sheet-head h2{margin:0;font-size:18px}.sheet-head p{margin:0 0 3px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.sheet-head button{width:38px;height:38px;border:0;border-radius:50%;background:#e9eee8;font-size:21px}.list{overflow:auto;padding:5px 12px 14px}.list button{width:100%;display:grid;grid-template-columns:35px 1fr;gap:10px;align-items:start;padding:11px 5px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}.list .badge{width:32px;height:32px;border-radius:10px;font-size:12px}.list .badge.parki2{background:#dce8f8;color:#264d82}.list strong,.list small{display:block}.list strong{font-size:12px}.list small{margin-top:3px;color:var(--muted);font-size:10px;line-height:1.4}
    .marker{width:35px;height:35px;display:grid;place-items:center;border:3px solid #fff;border-radius:50% 50% 50% 8px;background:var(--green);box-shadow:0 3px 12px #153b3550;color:#fff;font-size:11px;font-weight:900;transform:rotate(-45deg)}.marker span{transform:rotate(45deg)}.marker.parki2{background:var(--blue);border-radius:12px}.marker-wrap{background:transparent;border:0}.leaflet-control-zoom{margin-top:174px!important;border:0!important;box-shadow:0 4px 14px #153b3520!important}.leaflet-control-zoom a{color:var(--ink)!important}.leaflet-control-attribution{font-size:9px!important;background:#ffffffe0!important}.hidden{display:none!important}
    @media(min-width:760px){.topbar{top:20px;left:20px;width:360px}.toolbar{top:95px;left:20px;right:auto;width:360px}.filters{top:144px;left:20px}.hint,.details,.parcel-card{left:20px;right:auto;bottom:20px;width:380px}.list-sheet{top:20px;bottom:20px;left:20px;right:auto;width:380px;max-height:none;border-radius:20px}.leaflet-control-zoom{margin-top:20px!important}}
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Mapa miejsc nalotów w Bochni"></div>
  <header class="topbar"><span class="brand" aria-hidden="true">⌖</span><div><p>Bochnia · 11 lokalizacji</p><h1>Miejsca nalotów</h1></div></header>
  <nav class="toolbar" aria-label="Narzędzia mapy"><button id="all">⌖ Wszystkie</button><button id="base" aria-label="Zmień podkład mapowy">▧ Podkład: ulice</button><button id="open-list">☷ Lista</button></nav>
  <nav class="filters" aria-label="Widoczność warstw"><button data-layer="parki" aria-pressed="true"><span class="dot"></span>Parki · 7</button><button data-layer="parki2" aria-pressed="true"><span class="dot"></span>Parki2 · 4</button></nav>
  <div id="status" class="status hidden" role="status"></div>
  <button class="hint" id="hint"><span class="symbol">⌖</span><span><strong>Wybierz punkt na mapie</strong><small>Otwórz lokalizację, ortofoto lub Street View</small></span></button>
  <article id="details" class="details hidden" aria-live="polite"></article>
  <article id="parcel" class="parcel-card hidden" aria-live="polite"></article>
  <section id="list-sheet" class="list-sheet hidden" aria-label="Lista lokalizacji"><div class="sheet-head"><div><p>Warstwy z gisss · Bochnia</p><h2>Lokalizacje nalotów</h2></div><button id="close-list" aria-label="Zamknij listę">×</button></div><div class="list" id="list"></div></section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const features = [
      {key:'parki-1',layer:'parki',name:'Park / skwer na Placu ks. Antoniego Czaplińskiego',type:'park miejski / skwer',location:'Plac ks. Antoniego Czaplińskiego; między ul. Bernardyńską, Studencką i Matejki',area:'0,41 ha',confidence:'wysoka',source:'bochnia.eu; OpenStreetMap',coords:[20.4245294,49.9681887]},
      {key:'parki-2',layer:'parki',name:'Park kieszonkowy / Skwer Bochneris',type:'park kieszonkowy / skwer',location:'ul. Jana Matejki, przy Domu Matejki / dawnym szybie Bochneris',area:'0,022 ha',confidence:'wysoka',source:'bochnia.eu; OpenStreetMap',coords:[20.425878,49.9686215]},
      {key:'parki-3',layer:'parki',name:'Skwer im. Waleriana Kasprzyka',type:'skwer / plac zieleni',location:'U zbiegu ul. Konstytucji III Maja i ul. Więźniów Oświęcimia',area:'0,045 ha',confidence:'wysoka',source:'bochnia.eu; OpenStreetMap',coords:[20.4275629,49.9745468]},
      {key:'parki-4',layer:'parki',name:'Park Rodzinny Uzbornia (teren A)',type:'park',location:'Bochnia',coords:[20.426566478794182,49.9634630288683]},
      {key:'parki-5',layer:'parki',name:'Park Rodzinny Uzbornia (teren B)',type:'park',location:'Bochnia',coords:[20.42980006729478,49.966489624613686]},
      {key:'parki-6',layer:'parki',name:'Plac Turka',type:'plac / zieleniec',location:'Bochnia',coords:[20.42897255245232,49.96742461325153]},
      {key:'parki-7',layer:'parki',name:'Planty Satelitarne',type:'park / zieleniec',location:'Bochnia',coords:[20.426259452882537,49.97094625033781]},
      {key:'parki2-1',layer:'parki2',name:'Punkt parki2 1',type:'miejsce nalotu',location:'Bochnia',coords:[20.41643491812858,49.942451102281346]},
      {key:'parki2-2',layer:'parki2',name:'Punkt parki2 2',type:'miejsce nalotu',location:'Bochnia',coords:[20.391533808810603,49.98437835150911]},
      {key:'parki2-3',layer:'parki2',name:'Punkt parki2 3',type:'miejsce nalotu',location:'Bochnia',coords:[20.412872756774497,49.975190936704294]},
      {key:'parki2-4',layer:'parki2',name:'Punkt parki2 4',type:'miejsce nalotu',location:'Bochnia',coords:[20.43032437602281,49.969416145476316]}
    ];
    const map=L.map('map',{zoomControl:false,preferCanvas:true});L.control.zoom({position:'topright'}).addTo(map);
    const basemaps={
      streets:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}),
      ortho:L.tileLayer.wms('https://mapy.geoportal.gov.pl/wss/service/PZGIK/ORTO/WMS/StandardResolution',{layers:'Raster',format:'image/jpeg',version:'1.3.0',maxZoom:21,attribution:'Ortofotomapa &copy; <a href="https://www.geoportal.gov.pl/">GUGiK / Geoportal</a>'}),
      esri:L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community'})
    };
    let base='streets';basemaps[base].addTo(map);
    map.createPane('cadastre');map.getPane('cadastre').style.zIndex='420';map.getPane('cadastre').style.pointerEvents='none';
    const cadastre=L.tileLayer.wms('https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaEwidencjiGruntow',{layers:'dzialki,numery_dzialek',format:'image/png',version:'1.1.1',transparent:true,maxZoom:21,pane:'cadastre',attribution:'Działki i numery działek &copy; <a href="https://www.geoportal.gov.pl/">GUGiK / KIEG</>'});
    const groups={parki:L.layerGroup().addTo(map),parki2:L.layerGroup().addTo(map)},markers=new Map();let parcelHighlight=null;
    const $=id=>document.getElementById(id), hide=id=>$(id).classList.add('hidden'), show=id=>$(id).classList.remove('hidden');
    function safeText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function closeCards(){hide('details');hide('parcel');show('hint')}
    function openFeature(f){hide('list-sheet');hide('parcel');hide('hint');const lat=f.coords[1],lng=f.coords[0],badge=f.layer==='parki'?'P':'P2';const meta=[['Warstwa',f.layer],['Typ',f.type],['Lokalizacja',f.location],['Powierzchnia',f.area],['Pewność lokalizacji',f.confidence],['Źródło',f.source]].filter(x=>x[1]);const rows=meta.map(([label,value])=>`<div><dt>${safeText(label)}</dt><dd>${safeText(value)}</dd></div>`).join('');const street=`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;const route=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;$('details').innerHTML=`<button class="close" aria-label="Zamknij szczegóły">×</button><div class="detail-head"><span class="badge">${badge}</span><div><p>${safeText(f.layer)} · ${safeText(f.key)}</p><h2>${safeText(f.name)}</h2></div></div><dl class="meta">${rows}</dl><div class="links"><a href="${street}" target="_blank" rel="noreferrer">◉ Street View</a><a class="secondary" href="${route}" target="_blank" rel="noreferrer">↗ Trasa</a></div>`;show('details');$('details').querySelector('.close').onclick=closeCards;map.flyTo([lat,lng],Math.max(map.getZoom(),16),{duration:.45})}
    for(const f of features){const isSecond=f.layer==='parki2',label=isSecond?'2':'P';const icon=L.divIcon({className:'marker-wrap',html:`<span class="marker ${isSecond?'parki2':''}"><span>${label}</span></span>`,iconSize:[38,42],iconAnchor:[19,38]});const marker=L.marker([f.coords[1],f.coords[0]],{icon,title:f.name,keyboard:true,alt:f.name}).on('click',()=>openFeature(f)).addTo(groups[f.layer]);markers.set(f.key,marker)}
    const points=features.map(f=>[f.coords[1],f.coords[0]]);map.fitBounds(points,{paddingTopLeft:[20,170],paddingBottomRight:[20,100],maxZoom:14});
    function updateCadastre(){if(map.getZoom()>=16){if(!map.hasLayer(cadastre))cadastre.addTo(map)}else if(map.hasLayer(cadastre))map.removeLayer(cadastre)}map.on('zoomend',updateCadastre);updateCadastre();
    $('base').onclick=()=>{const order=['streets','ortho','esri'],labels={streets:'ulice',ortho:'ortofoto',esri:'Esri'};const next=order[(order.indexOf(base)+1)%order.length];map.removeLayer(basemaps[base]);base=next;basemaps[base].addTo(map);$('base').textContent=`▧ Podkład: ${labels[base]}`};
    $('all').onclick=()=>{map.fitBounds(points,{paddingTopLeft:[20,170],paddingBottomRight:[20,100],maxZoom:14});closeCards()};
    document.querySelectorAll('.filters button').forEach(button=>button.onclick=()=>{const key=button.dataset.layer,visible=button.getAttribute('aria-pressed')==='true';button.setAttribute('aria-pressed',String(!visible));if(visible)map.removeLayer(groups[key]);else groups[key].addTo(map)});
    $('list').innerHTML=features.map(f=>`<button data-key="${f.key}"><span class="badge ${f.layer==='parki2'?'parki2':''}">${f.layer==='parki'?'P':'P2'}</span><span><strong>${safeText(f.name)}</strong><small>${safeText(f.location)}${f.area?` · ${safeText(f.area)}`:''}</small></span></button>`).join('');
    $('list').onclick=e=>{const row=e.target.closest('button[data-key]');if(row){const f=features.find(item=>item.key===row.dataset.key);if(f){const filter=document.querySelector(`.filters button[data-layer="${f.layer}"]`);filter.setAttribute('aria-pressed','true');groups[f.layer].addTo(map);openFeature(f)}}};
    $('open-list').onclick=()=>{hide('details');hide('parcel');hide('hint');show('list-sheet')};$('close-list').onclick=()=>{hide('list-sheet');show('hint')};$('hint').onclick=()=>$('open-list').click();
    $('map').addEventListener('click',async event=>{if(event.target.closest('.leaflet-marker-icon,.leaflet-control'))return;const point=map.mouseEventToLatLng(event);$('status').textContent='Sprawdzam numer działki…';show('status');try{const url=`https://uldk.gugik.gov.pl/?request=GetParcelByXY&xy=${point.lng},${point.lat},4326&result=id,parcel,region,commune,county,voivodeship,datasource,geom_wkt&srid=4326`;const response=await fetch(url);if(!response.ok)throw Error('request failed');const lines=(await response.text()).trim().split(/\r?\n/);if(lines[0]!=='0'||!lines[1])throw Error('parcel not found');const v=lines.slice(1).join('\n').split('|');const wkt=v.slice(7).join('|'),ring=[...wkt.matchAll(/(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)/g)].map(m=>[Number(m[2]),Number(m[1])]);if(parcelHighlight)map.removeLayer(parcelHighlight);if(ring.length>2)parcelHighlight=L.polygon(ring,{color:'#e1a900',weight:3,fillColor:'#ffdf66',fillOpacity:.15}).addTo(map);$('parcel').innerHTML=`<button class="close" aria-label="Zamknij">×</button><p class="section-label">Działka wskazana na mapie</p><h2>${safeText(v[1])}</h2><p class="parcel-meta">Id: ${safeText(v[0])}<br>Obręb: ${safeText(v[2])} · Gmina: ${safeText(v[3])}<br>Źródło: ULDK GUGiK · ${safeText(v[6])}</p>`;$('parcel').querySelector('.close').onclick=()=>{hide('parcel');if(parcelHighlight){map.removeLayer(parcelHighlight);parcelHighlight=null}show('hint')};hide('status');hide('hint');show('parcel')}catch{ $('status').textContent='Nie udało się ustalić działki w tym miejscu';setTimeout(()=>hide('status'),3500)}});
    $('map').addEventListener('keydown',e=>{if(e.key==='Escape'){closeCards();hide('list-sheet')}});
  </script>
</body>
</html>
